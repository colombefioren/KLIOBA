<div th:fragment="header" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <header class="bg-[#16163f] text-white sticky top-0 z-50">

        <nav sec:authorize="isAuthenticated()"
             class="w-full px-6 sm:px-10 lg:px-16 h-[72px] flex justify-between items-center">

            <a href="/" class="text-xl sm:text-2xl font-bold text-white xl:pl-20">Klioba</a>

            <div class="hidden md:flex items-center space-x-4 lg:space-x-6 xl:pr-20">
                <th:block th:replace="fragments/nav :: nav('/dashboard', 'Clubs', '', '', 'hover:text-[#9933cc] transition-colors')"></th:block>

                <div class="flex items-center space-x-4">
                    <div class="flex items-center gap-2 text-white">
                        <i class="material-icons text-base">account_circle</i>
                        <span class="hidden lg:inline text-sm" th:text="'(' + ${#authentication.getPrincipal().getAttribute('email')} + ')'"></span>
                    </div>
                    <th:block th:replace="fragments/nav :: nav('/logout', 'Log out', '', 'bg-red-600', 'hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition-colors')"></th:block>
                </div>
            </div>

            <button id="mobile-menu-button" aria-label="Toggle menu" aria-expanded="false"
                    class="md:hidden focus:outline-none p-1">
                <div id="burger-icon" class="flex flex-col gap-[5px]">
                    <span class="w-6 h-[2px] bg-white rounded-full origin-center"></span>
                    <span class="w-6 h-[2px] bg-white rounded-full origin-center"></span>
                    <span class="w-6 h-[2px] bg-white rounded-full origin-center"></span>
                </div>
            </button>
        </nav>

        <div sec:authorize="isAuthenticated()"
             id="mobile-menu"
             class="md:hidden bg-[#16163f] border-t border-white/10 overflow-hidden"
             style="max-height:0; transition: max-height 0.3s ease;">
            <div class="px-6 sm:px-10 py-5 flex flex-col gap-4 text-sm font-medium">

                <th:block th:replace="fragments/nav :: nav('/dashboard', 'Clubs', '', 'text-gray-300 font-medium', 'hover:text-[#9933cc] transition-colors')"></th:block>

                <div class="flex items-center gap-2 text-gray-400 text-xs">
                    <i class="material-icons text-base">account_circle</i>
                    <span th:text="${#authentication.getPrincipal().getAttribute('email')}"></span>
                </div>

                <th:block th:replace="fragments/nav :: nav('/logout', 'Log out', 'logout', 'bg-red-600 text-white font-bold py-2 px-4 rounded-lg w-fit', 'hover:bg-red-700 transition-colors')"></th:block>

            </div>
        </div>

        <nav sec:authorize="isAnonymous()"
             class="w-full px-6 sm:px-10 lg:px-16 h-[72px] flex justify-between items-center">

            <a href="/" class="text-xl sm:text-2xl font-bold text-white xl:pl-20">Klioba</a>

            <div class="hidden md:flex items-center space-x-4 lg:space-x-6 text-sm font-medium text-gray-300">
                <a class="hover:text-[#9933cc] transition-colors" href="#contact">Contact</a>
            </div>

            <div class="hidden md:flex items-center space-x-4 xl:pr-20">
                <th:block th:replace="fragments/nav :: nav('/oauth2/authorization/casdoor', 'Se connecter', '', 'bg-[#9933cc]', 'hover:bg-purple-700 text-white font-bold py-2 px-5 rounded-full transition-colors')"></th:block>
            </div>

            <button id="mobile-menu-button-anon" aria-label="Toggle menu" aria-expanded="false"
                    class="md:hidden focus:outline-none p-1">
                <div id="burger-icon-anon" class="flex flex-col gap-[5px]">
                    <span class="w-6 h-[2px] bg-white rounded-full origin-center"></span>
                    <span class="w-6 h-[2px] bg-white rounded-full origin-center"></span>
                    <span class="w-6 h-[2px] bg-white rounded-full origin-center"></span>
                </div>
            </button>
        </nav>

        <div sec:authorize="isAnonymous()"
             id="mobile-menu-anonymous"
             class="md:hidden bg-[#16163f] border-t border-white/10 overflow-hidden"
             style="max-height:0; transition: max-height 0.3s ease;">
            <div class="px-6 sm:px-10 py-5 flex flex-col gap-4 text-sm font-medium">

                <th:block th:replace="fragments/nav :: nav('/oauth2/authorization/casdoor', 'Se connecter', 'login', 'bg-[#9933cc] text-white font-bold py-2 px-4 rounded-full w-fit', 'hover:bg-purple-700 transition-colors')"></th:block>

            </div>
        </div>

    </header>

    <style>
        #burger-icon span,
        #burger-icon-anon span {
            display: block;
            transition: transform 0.25s ease, opacity 0.2s ease;
        }
        #burger-icon.open span:nth-child(1),
        #burger-icon-anon.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }

        #burger-icon.open span:nth-child(2),
        #burger-icon-anon.open span:nth-child(2) { opacity: 0; }

        #burger-icon.open span:nth-child(3),
        #burger-icon-anon.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    </style>

    <script>
        function setupBurger(btnId, iconId, menuId) {
            const btn  = document.getElementById(btnId);
            const icon = document.getElementById(iconId);
            const menu = document.getElementById(menuId);

            if (!btn || !menu) return;

            btn.addEventListener('click', () => {
                const isOpen = menu.style.maxHeight !== '0px' && menu.style.maxHeight !== '';
                menu.style.maxHeight = isOpen ? '0' : '400px';
                icon.classList.toggle('open', !isOpen);
                btn.setAttribute('aria-expanded', String(!isOpen));
            });

            menu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    menu.style.maxHeight = '0';
                    icon.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');
                });
            });
        }

        setupBurger('mobile-menu-button',      'burger-icon',      'mobile-menu');
        setupBurger('mobile-menu-button-anon', 'burger-icon-anon', 'mobile-menu-anonymous');
    </script>
</div>
